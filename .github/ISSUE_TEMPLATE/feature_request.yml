name: Feature or design discussion
description: Describe the authoring or integration problem you want to solve.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: A concrete workflow is more useful than a feature name alone.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed behavior
      description: Explain how it would work for someone using Platno.
  - type: textarea
    id: boundaries
    attributes:
      label: Package or host application?
      description: Could this be a custom plugin? Does it require a dependency or change a content contract?
